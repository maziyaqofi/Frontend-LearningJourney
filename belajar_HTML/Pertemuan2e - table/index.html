<!DOCTYPE html>
<html>
    <!-- Tanggal: 9 Desember 2024 -->
    <head>
        <title>Tabel</title>
    </head>
    <body>
        <h1>Membuat Tabel</h1>

        <h4>Membuat table standar</h4>
        <table border="1">
            <!-- tr, baris -->
            <!-- td, data -->
            <!-- th, header -->
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
        </table>

        <h4>Membuat table dengan header</h4>
        <table border="1">
            <tr>
                <th>Senin</th>
                <th>Selasa</th>
                <th>Rabu</th>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
        </table>
        <br>
        <table border="1">
            <tr>
                <th></th>
                <th>Senin</th>
                <th>Selasa</th>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
        </table>
        <h4>Alokasi kolom</h4>
        <table border="1">
            <tr>
                <th></th>
                <th>Selasa</th>
                <th>Rabu</th>
            </tr>
            <tr>
                <th>4</th>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <th rowspan="2">4</th>
                <td colspan="2">Makan</td>
            </tr>
                <td colspan="2">Makan</td>
            <tr>
                
            </tr>
        </table>
            
    </body>
</html>
